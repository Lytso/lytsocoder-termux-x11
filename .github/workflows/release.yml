name: Build & Publish Signed LytsoCoder:X11 Release

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'img/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fetch submodules
        run: git submodule update --init --recursive --jobs 8 --depth 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore from Secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > lorie-app/release.jks

      - name: Extract Version Info
        id: version
        run: |
          VERSION_NAME="$(grep -m 1 -E 'def version = "[^"]+"' lorie/version.gradle | sed -r 's/.*"([^"]+)".*/\1/')"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "tag=v${VERSION_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build sharedUid & standalone Release APKs and companion package
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || '123456' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'lytsocoder' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || '123456' }}
        run: |
          chmod +x gradlew
          ./gradlew :lorie-app:assembleSharedUidRelease :lorie-app:assembleStandaloneRelease :shell-loader:buildCompanionPackage

      - name: Organize Release Artifacts
        id: artifacts
        run: |
          mkdir -p release_output
          cp lorie-app/build/outputs/apk/sharedUid/release/termux-x11-universal-sharedUid-release.apk "release_output/lytsocoder-termux-x11-sharedUid.apk"
          cp lorie-app/build/outputs/apk/standalone/release/termux-x11-universal-release.apk "release_output/lytsocoder-termux-x11-standalone.apk"
          cp shell-loader/build/outputs/companion/*-all.deb release_output/ || true
          cp shell-loader/build/outputs/companion/*-any.pkg.tar.xz release_output/ || true
          (cd release_output && sha256sum * > checksums-sha256.txt)
          echo "apk_name=lytsocoder-termux-x11-sharedUid.apk" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lytsocoder-termux-x11-v${{ steps.version.outputs.version_name }}
          path: release_output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.sha }}
          name: LytsoCoder:X11 v${{ steps.version.outputs.version_name }}
          body: |
            Termux:X11 (sharedUid variant, `lytso.code.x11`) signed with the LytsoCoder release certificate.

            - Version: v${{ steps.version.outputs.version_name }}
            - Commit: ${{ steps.version.outputs.sha }}
            - Direct APK: `lytsocoder-termux-x11-sharedUid.apk`
          draft: false
          prerelease: false
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
